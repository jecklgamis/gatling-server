logLevel: info

server:
  http:
    port: 58080
  https:
    port: 58443
    keyFile: server.key
    certFile: server.crt

scriptsDir: scripts
workspaceDir: workspace
uploadDir: uploads

# Hosts /task/submit's http(s) downloader is allowed to fetch from, beyond
# anything that resolves to a public IP. localhost/127.0.0.1/::1 support the
# self-referential "upload then submit against /uploads" flow; add
# gatling-server.jecklgamis.com so the same flow works against the live
# domain, e.g. behind an ingress/load balancer where the pod can't reach
# itself via localhost.
taskSubmit:
  allowedHttpHosts:
    - host: localhost
    - host: 127.0.0.1
    - host: "::1"
    - host: gatling-server.jecklgamis.com
    # Example hosts requiring their own credentials (auth is optional per
    # host; type is "basic" or "bearer"). Uncomment and edit to use:
    # - host: some.internal.host
    #   auth:
    #     type: bearer
    #     token: some-token
    # - host: another.internal.host
    #   auth:
    #     type: basic
    #     username: some-user
    #     password: some-password

# Credentials gating the browsable /workspace/ and /uploads/ file listings
# (HTTP Basic Auth). Both default to "default" if left unset.
browseAuth:
  username: default
  password: default

heartbeat:
  enabled: true
  frequency: 2m

eventNotifiers:
  - type: sns
    enabled: false
    configMap:
      topicArn: some-topic-arn
      region: some-region
  - type: http
    enabled: true
    configMap:
      url: http://localhost:58080/blackhole

uploaders:
  - type: s3
    enabled: false
    configMap:
      region: some-region
      s3url: s3://some-bucket

downloaders:
  s3:
    enabled: false
    configMap:
      region: some-region

