# Default values for gatling-server.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: jecklgamis/gatling-server
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: "main"

# jecklgamis/gatling-server is a public image; only set this if you're
# pointing image.repository at a private registry/fork.
imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# API_TOKEN gates /task/upload, /task/submit, and the other /task/* endpoints
# (Authorization: Bearer <apiToken>). browseUsername/browsePassword gate
# /workspace/ and /uploads/ (HTTP Basic Auth) the same way. All three default
# to "default", matching the app's own built-in fallback, so this works out
# of the box but should be overridden for anything beyond a quick trial. Set
# existingSecretName instead to source all three from a Secret you manage
# yourself (must contain data/stringData keys named API_TOKEN,
# BROWSE_USERNAME and BROWSE_PASSWORD) without putting them in values.yaml/git.
apiToken: "default"
browseUsername: "default"
browsePassword: "default"
existingSecretName: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}

podSecurityContext: {}
  # Set fsGroup if persistence.enabled and the volume needs to be writable by
  # the container's non-root "app" user (see Dockerfile) on first mount.
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: true
  className: "nginx"
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/rewrite-target: /
    cert-manager.io/issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
  hosts:
    - host: gatling-server.jecklgamis.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: gatling-server-tls
      hosts:
        - gatling-server.jecklgamis.com

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 4
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

# gatling-server keeps task workspaces (uploaded jars, console/simulation
# logs, results) on local disk with no other durability unless the S3
# uploader is configured in the shipped config-prod.yaml. Enable this to
# survive pod restarts; leave it off for disposable/CI use. Not meant to be
# shared across replicas - keep replicaCount at 1 if enabled, since task
# state is also kept in memory per-pod.
persistence:
  enabled: false
  size: 10Gi
  storageClassName: ""
  accessModes:
    - ReadWriteOnce

nodeSelector: {}

tolerations: []

affinity: {}
